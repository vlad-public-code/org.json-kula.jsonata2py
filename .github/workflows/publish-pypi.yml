# Build, gate and publish jsonata2py to PyPI.
#
# Publishing uses PyPI Trusted Publishing (OIDC) -- there is no API token to
# store or rotate. Before the first run, register this workflow as a trusted
# publisher at https://pypi.org/manage/project/jsonata2py/settings/publishing/
# (and on TestPyPI for the manual path), matching:
#   owner: vlad-public-code   repo: org.json-kula.jsonata2py
#   workflow: publish-pypi.yml   environment: pypi (or testpypi)
#
# A GitHub release publishes to PyPI; a manual run defaults to TestPyPI so a
# dry run can never reach production by accident.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and every supported version above it. The floor is load
        # bearing: mypy is pinned to 3.11 semantics in pyproject.toml, and
        # running the suite on 3.11 is what catches newer-than-floor stdlib use.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # pyproject's addopts already deselects the `benchmark` and `perfgate`
      # markers: both are machine-dependent measurements, not correctness gates.
      - name: Tests
        run: python -m pytest -q

      - name: Types
        run: python -m mypy src

      - name: Lint
        run: python -m ruff check .

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      # Catches a long description PyPI would refuse to render, before upload.
      - name: Check metadata
        run: python -m twine check --strict dist/*

      # A tag that disagrees with pyproject's version otherwise fails at the
      # very end, as an opaque 400 from PyPI. Fail here instead, with a reason.
      - name: Verify version matches release tag
        if: github.event_name == 'release'
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag '$tag' does not match pyproject version '$version'. Bump the version, or retag."
            exit 1
          fi
          echo "version $version matches tag $tag"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
      url: ${{ github.event_name == 'release' && 'https://pypi.org/p/jsonata2py' || 'https://test.pypi.org/p/jsonata2py' }}
    permissions:
      # Required for Trusted Publishing, and for the PEP 740 attestations the
      # publish action generates. No other permission is needed here.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || '' }}
